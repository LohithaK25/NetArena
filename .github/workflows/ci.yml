
name: NetArena CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: true

      - name: Check Go formatting
        run: |
          unformatted="$(find . -type f -name '*.go' -not -path './.git/*' -print | xargs gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        run: go build ./...

  frontend:
    name: Frontend checks and browser integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend unit tests
        working-directory: web
        run: npm test

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run browser integration test
        shell: bash
        run: |
          go run ./cmd/netarena-server > /tmp/netarena-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health > /dev/null; then
              break
            fi

            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/netarena-api.log
              exit 1
            fi

            sleep 1
          done

          if ! curl --fail --silent http://127.0.0.1:8080/api/v1/health; then
            cat /tmp/netarena-api.log
            exit 1
          fi

          cd web
          npm run test:e2e
